[package]
name = "ai-usage"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ai-usage"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 2
